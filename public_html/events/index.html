  <body>
    <!--==================== HEADER ====================-->
    <header class="header" id="header">
      <!--Insert header script-->
      <script type="text/javascript" id="header-insert" src="/scripts/insert-header.js"></script>
    </header>

    <!--==================== SEARCH ====================-->
    <div class="search" id="search">
      <form action="" class="search__form">
        <i class="ri-search-line search__icon"></i>
        <input
          type="search"
          placeholder="What are you looking for?"
          class="search__input"
        />
      </form>
      <i class="ri-close-line search__close" id="search-close"></i>
    </div>

    <!--==================== LOGIN ====================-->
    <div class="login" id="login">
      <form action="" class="login__form">
        <h2 class="login__title">Log in</h2>

        <div class="login__group">
          <div>
            <label for="" class="login__label">Email</label>
            <input
              type="email"
              placeholder="Write your email please"
              class="login__input"
              id="email"
            />
          </div>

          <div>
            <label for="password" class="login__label">Password</label>
            <input
              type="password"
              placeholder="Enter your password please"
              class="login__input"
              id="password"
            />
          </div>
        </div>

        <div>
          <p class="login__signup">
            You do not have an account? <a href="#">Sign up</a>
          </p>

          <a href="#" class="login__forgot"> You forgot your password </a>

          <button class="login__button" type="submit">Log In</button>
        </div>
      </form>

      <i class="ri-close-line login__close" id="login-close"></i>
    </div>
